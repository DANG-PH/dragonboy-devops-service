name: Deploy VPS

on:
  repository_dispatch:
    types: [deploy]

concurrency:
  group: deploy-vps-shared
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ github.event.client_payload.port == 'docker' && secrets.HOST_VPS1 || format('{0},{1}', secrets.HOST_VPS2, secrets.HOST_VPS3) }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "====== DEBUG HOST ======"
            echo "HOSTNAME: $(hostname)"
            echo "IP: $(curl -s ifconfig.me)"
            echo "========================"

            SERVICE="${{ github.event.client_payload.service }}"
            DIR="${{ github.event.client_payload.dir }}"
            PORT="${{ github.event.client_payload.port }}"
            LANG="${{ github.event.client_payload.lang }}"   
            PREV_FILE="/tmp/prev_commit_${SERVICE}.txt"

            cd $DIR
            git reset --hard HEAD
            git clean -fd
            git rev-parse HEAD > $PREV_FILE
            PREV=$(cat $PREV_FILE)
            git pull origin master

            if [ "$PORT" = "docker" ]; then
              echo "Docker service → docker compose up"
              docker compose up -d --force-recreate nginx

            elif [ "$LANG" = "go" ]; then
              echo "Go service → go build"
              export PATH=$PATH:/usr/local/go/bin
              go build -o $SERVICE ./cmd/api/main.go
              pm2 restart $SERVICE

            else
              if [ ! -d "node_modules" ] || [ ! -f "node_modules/.bin/nest" ]; then
                echo "node_modules missing → force npm install --prefer-offline"
                rm -rf node_modules
                npm install --prefer-offline
              elif git diff $PREV HEAD -- package-lock.json | grep -q .; then
                echo "Dependencies changed → npm install"
                npm install --prefer-offline
              else
                echo "No changes → skip"
              fi

              npm run build
              pm2 reload $SERVICE
            fi

      - name: Health Check & Rollback
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ github.event.client_payload.port == 'docker' && secrets.HOST_VPS1 || format('{0},{1}', secrets.HOST_VPS2, secrets.HOST_VPS3) }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "====== DEBUG HOST ======"
            echo "HOSTNAME: $(hostname)"
            echo "IP: $(curl -s ifconfig.me)"
            echo "========================"

            SERVICE="${{ github.event.client_payload.service }}"
            DIR="${{ github.event.client_payload.dir }}"
            PORT="${{ github.event.client_payload.port }}"
            LANG="${{ github.event.client_payload.lang }}"   
            SKIP="${{ github.event.client_payload.skip_health_check }}"
            PREV_FILE="/tmp/prev_commit_${SERVICE}.txt"

            if [ "$PORT" = "docker" ]; then
              for i in 1 2 3 4 5; do
                sleep 3
                if docker compose -f $DIR/docker-compose.yml ps nginx | grep -qE "Up|running"; then
                  echo "✅ nginx container is Up"
                  exit 0
                fi
                echo "⏳ Waiting for nginx container... attempt $i/5"
              done
              echo "❌ nginx container failed, rolling back..."
              cd $DIR
              git reset --hard $(cat $PREV_FILE)
              docker compose up -d --force-recreate nginx
              exit 1
            fi

            if [ "$SKIP" = "true" ]; then
              echo "Skipping health check for $SERVICE (no HTTP server)"
              for i in 1 2 3 4 5; do
                sleep 3
                if pm2 show $SERVICE | grep -q "online"; then
                  echo "✅ $SERVICE is online"
                  exit 0
                fi
                echo "⏳ Waiting for $SERVICE... attempt $i/5"
              done
              echo "❌ $SERVICE is not online, rolling back..."
              cd $DIR
              pm2 stop $SERVICE
              git reset --hard $(cat $PREV_FILE)
              if [ "$LANG" = "go" ]; then
                export PATH=$PATH:/usr/local/go/bin
                go build -o $SERVICE ./cmd/api/main.go
              else
                npm install --prefer-offline
                npm run build
              fi
              pm2 start $SERVICE
              exit 1
            fi

            MAX_RETRIES=12
            RETRY_INTERVAL=5
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Health check attempt $i/$MAX_RETRIES..."
              if curl -sf http://localhost:${PORT}/health; then
                echo "Health check passed"
                exit 0
              fi
              sleep $RETRY_INTERVAL
            done

            echo "Rolling back..."
            cd $DIR
            git reset --hard $(cat $PREV_FILE)
            if [ "$LANG" = "go" ]; then
              export PATH=$PATH:/usr/local/go/bin
              go build -o $SERVICE ./cmd/api/main.go
              pm2 restart $SERVICE
            else
              npm install --prefer-offline
              npm run build
              pm2 reload $SERVICE
            fi
            exit 1

      - name: Notify Discord
        if: always()
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          ACTOR: ${{ github.event.client_payload.actor }}
          COMMIT_SHA: ${{ github.event.client_payload.commit }}
          COMMIT_MESSAGE: ${{ github.event.client_payload.message }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            COLOR=5763719
            TITLE="Deploy thành công 🚀"
            STATUS="✅ CI/CD SUCCESS"
          else
            COLOR=15548997
            TITLE="Deploy thất bại 💥"
            STATUS="❌ CI/CD FAILED"
          fi

          DEPLOY_TIME=$(TZ='Asia/Ho_Chi_Minh' date '+%d/%m/%Y %H:%M:%S')

          PAYLOAD=$(jq -n \
            --arg content "$STATUS" \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg service "$SERVICE" \
            --arg actor "$ACTOR" \
            --arg deployTime "$DEPLOY_TIME (UTC+7)" \
            --arg commit "$COMMIT_SHA" \
            --arg message "$COMMIT_MESSAGE" \
            --arg logValue "[Bấm vào đây]($RUN_URL)" \
            '{
              content: $content,
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  { name: "Service", value: $service, inline: true },
                  { name: "Actor", value: $actor, inline: true },
                  { name: "Thời gian", value: $deployTime, inline: true },
                  { name: "Commit", value: $commit, inline: false },
                  { name: "Message", value: $message, inline: false },
                  { name: "🔍 Xem log", value: $logValue, inline: false }
                ]
              }]
            }')

          curl --retry 3 --retry-delay 2 \
          -H "Content-Type: application/json" \
          -X POST \
          -d "$PAYLOAD" \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"
